<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pushup Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            text-align: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
        .screen { display: none; padding: 20px 10px; }
        .screen.active { display: block; }

        .menu-button {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 12px auto;
            padding: 16px;
            font-size: 18px;
            background: #1c1c1c;
            color: white;
            border: 1px solid #333;
            border-radius: 12px;
        }
        .menu-button.primary {
            background: #00FF00;
            color: #111;
            font-weight: bold;
            border: none;
        }

        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: #00FF00;
            font-size: 18px;
        }

        .container { width: 480px; max-width: 100%; margin: 0 auto; }
        video { display: none; }
        canvas { display: block; width: 100%; height: auto; margin: 0 auto; }
        #status { font-size: 18px; margin: 8px; min-height: 24px; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            max-width: 320px;
            margin: 10px auto;
            padding: 12px 16px;
            background: #1c1c1c;
            border-radius: 10px;
        }

        .leader-row {
            display: flex;
            justify-content: space-between;
            max-width: 320px;
            margin: 6px auto;
            padding: 10px 16px;
            background: #1c1c1c;
            border-radius: 10px;
        }

        .achievement-row {
            max-width: 320px;
            margin: 8px auto;
            padding: 12px 16px;
            background: #1c1c1c;
            border-radius: 10px;
            text-align: left;
        }
        .achievement-row.locked { opacity: 0.4; }

        .loading { opacity: 0.6; font-size: 14px; margin: 10px; }
    </style>
</head>
<body>

    <!-- ===== ЭКРАН: ГЛАВНОЕ МЕНЮ ===== -->
    <div id="screen-menu" class="screen active">
        <h1>💪 Pushup Tracker</h1>
        <button class="menu-button primary" onclick="showScreen('camera')">📷 Начать поход</button>
        <button class="menu-button" onclick="showScreen('profile')">👤 Профиль</button>
        <button class="menu-button" onclick="showScreen('leaderboard')">🏆 Таблица лидеров</button>
        <button class="menu-button" onclick="showScreen('achievements')">🎖 Достижения</button>
    </div>

    <!-- ===== ЭКРАН: КАМЕРА / ПОДСЧЁТ ===== -->
    <div id="screen-camera" class="screen">
        <button class="back-button" onclick="showScreen('menu')">← Назад</button>
        <h2>Подсчёт отжиманий</h2>
        <h1 id="counter" style="font-size: 60px; color: #00FF00;">0</h1>
        <p id="status">Займите позицию для отжиманий 🧎</p>
        <button id="finishBtn" class="menu-button primary" style="max-width: 220px;">Завершить подход</button>
        <div class="container">
            <video id="video" width="480" height="640" autoplay playsinline muted></video>
            <canvas id="canvas" width="480" height="640"></canvas>
        </div>
    </div>

    <!-- ===== ЭКРАН: ПРОФИЛЬ ===== -->
    <div id="screen-profile" class="screen">
        <button class="back-button" onclick="showScreen('menu')">← Назад</button>
        <h2>👤 Профиль</h2>
        <div id="profile-loading" class="loading">Загрузка...</div>
        <div id="profile-content" style="display: none;">
            <div class="stat-row"><span>Звание</span><span id="profile-level">—</span></div>
            <div class="stat-row"><span>Очки</span><span id="profile-points">—</span></div>
            <div class="stat-row"><span>Отжиманий всего</span><span id="profile-total">—</span></div>
            <div class="stat-row"><span>До след. звания</span><span id="profile-next">—</span></div>
        </div>
    </div>

    <!-- ===== ЭКРАН: ТАБЛИЦА ЛИДЕРОВ ===== -->
    <div id="screen-leaderboard" class="screen">
        <button class="back-button" onclick="showScreen('menu')">← Назад</button>
        <h2>🏆 Таблица лидеров</h2>
        <div id="leaderboard-loading" class="loading">Загрузка...</div>
        <div id="leaderboard-list"></div>
    </div>

    <!-- ===== ЭКРАН: ДОСТИЖЕНИЯ ===== -->
    <div id="screen-achievements" class="screen">
        <button class="back-button" onclick="showScreen('menu')">← Назад</button>
        <h2>🎖 Достижения</h2>
        <div id="achievements-list"></div>
        <p style="opacity: 0.5; font-size: 14px;">(тестовые данные, подключим позже)</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        const API_BASE = "https://pushup-bot-server.onrender.com";

        let cameraStarted = false;

        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');

            if (name === 'camera' && !cameraStarted) {
                startCamera();
                cameraStarted = true;
            }
            if (name === 'profile') {
                loadProfile();
            }
            if (name === 'leaderboard') {
                loadLeaderboard();
            }
            if (name === 'achievements') {
                loadAchievementsMock();
            }
        }

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = urlParams.get('user_id');
            if (idFromUrl) return idFromUrl;

            const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            return tgUser ? tgUser.id : null;
        }

        async function loadProfile() {
            const userId = getUserId();
            document.getElementById('profile-loading').style.display = 'block';
            document.getElementById('profile-content').style.display = 'none';

            if (!userId) {
                document.getElementById('profile-loading').innerText = "Не удалось определить пользователя";
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/profile?user_id=${userId}`);
                const data = await response.json();

                document.getElementById('profile-level').innerText = data.level;
                document.getElementById('profile-points').innerText = data.points + " ⭐";
                document.getElementById('profile-total').innerText = data.total_pushups;
                document.getElementById('profile-next').innerText =
                    data.points_to_next_level !== null
                        ? `${data.points_to_next_level} очков до «${data.next_level}»`
                        : "Максимальный уровень! 🎉";

                document.getElementById('profile-loading').style.display = 'none';
                document.getElementById('profile-content').style.display = 'block';
            } catch (error) {
                document.getElementById('profile-loading').innerText = "Не удалось загрузить профиль. Попробуйте позже.";
            }
        }

        async function loadLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            const loading = document.getElementById('leaderboard-loading');
            loading.style.display = 'block';
            list.innerHTML = "";

            try {
                const response = await fetch(`${API_BASE}/api/leaderboard`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data.leaderboard.length === 0) {
                    list.innerHTML = "<p>Пока никто не отжимался 🤷</p>";
                    return;
                }

                data.leaderboard.forEach((user, index) => {
                    const row = document.createElement('div');
                    row.className = 'leader-row';
                    row.innerHTML = `<span>${index + 1}. ${user.name}</span><span>${user.points} ⭐</span>`;
                    list.appendChild(row);
                });
            } catch (error) {
                loading.innerText = "Не удалось загрузить таблицу лидеров. Попробуйте позже.";
            }
        }

        function loadAchievementsMock() {
            const mockAchievements = [
                { title: "🥉 Первые 10 отжиманий", unlocked: true },
                { title: "🥈 100 отжиманий за день", unlocked: false },
                { title: "🥇 30 дней без пропуска", unlocked: false },
                { title: "🎯 1000 отжиманий за всё время", unlocked: false }
            ];
            const list = document.getElementById('achievements-list');
            list.innerHTML = "";
            mockAchievements.forEach(a => {
                const row = document.createElement('div');
                row.className = 'achievement-row' + (a.unlocked ? '' : ' locked');
                row.innerText = a.title + (a.unlocked ? " ✅" : " 🔒");
                list.appendChild(row);
            });
        }

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let pushupCount = 0;
        let stage = "up";
        let inPosition = false;

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) {
                angle = 360 - angle;
            }
            return angle;
        }

        const LEFT_SHOULDER = 11;
        const RIGHT_SHOULDER = 12;
        const LEFT_ELBOW = 13;
        const RIGHT_ELBOW = 14;
        const LEFT_WRIST = 15;
        const RIGHT_WRIST = 16;

        const POINTS_TO_SHOW = [LEFT_SHOULDER, RIGHT_SHOULDER, LEFT_ELBOW, RIGHT_ELBOW, LEFT_WRIST, RIGHT_WRIST];

        const CONNECTIONS_TO_SHOW = [
            [LEFT_SHOULDER, LEFT_ELBOW],
            [LEFT_ELBOW, LEFT_WRIST],
            [RIGHT_SHOULDER, RIGHT_ELBOW],
            [RIGHT_ELBOW, RIGHT_WRIST],
            [LEFT_SHOULDER, RIGHT_SHOULDER]
        ];

        function checkPosition(landmarks) {
            const requiredPoints = [
                LEFT_SHOULDER, RIGHT_SHOULDER,
                LEFT_ELBOW, RIGHT_ELBOW,
                LEFT_WRIST, RIGHT_WRIST
            ];
            return requiredPoints.every(idx => landmarks[idx].visibility > 0.6);
        }

        function countPushups(landmarks) {
            const shoulder = landmarks[LEFT_SHOULDER];
            const elbow = landmarks[LEFT_ELBOW];
            const wrist = landmarks[LEFT_WRIST];

            const angle = calculateAngle(shoulder, elbow, wrist);

            if (angle < 90) {
                stage = "down";
            }

            if (angle > 160 && stage === "down") {
                stage = "up";
                pushupCount++;
                document.getElementById('counter').innerText = pushupCount;
            }
        }

        function drawSelectedLandmarks(landmarks) {
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 3;

            for (const [startIdx, endIdx] of CONNECTIONS_TO_SHOW) {
                const start = landmarks[startIdx];
                const end = landmarks[endIdx];
                ctx.beginPath();
                ctx.moveTo(start.x * canvas.width, start.y * canvas.height);
                ctx.lineTo(end.x * canvas.width, end.y * canvas.height);
                ctx.stroke();
            }

            ctx.fillStyle = '#FF0000';
            for (const idx of POINTS_TO_SHOW) {
                const point = landmarks[idx];
                ctx.beginPath();
                ctx.arc(point.x * canvas.width, point.y * canvas.height, 6, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        function onResults(results) {
            if (canvas.width !== results.image.width || canvas.height !== results.image.height) {
                canvas.width = results.image.width;
                canvas.height = results.image.height;
            }

            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.poseLandmarks) {
                drawSelectedLandmarks(results.poseLandmarks);

                inPosition = checkPosition(results.poseLandmarks);

                if (inPosition) {
                    statusEl.innerText = "Позиция ОК, считаем! 💪";
                    statusEl.style.color = "#00FF00";
                    countPushups(results.poseLandmarks);
                } else {
                    statusEl.innerText = "Займите позицию для отжиманий 🧎";
                    statusEl.style.color = "white";
                }
            } else {
                inPosition = false;
                statusEl.innerText = "Не вижу тело в кадре 👀";
                statusEl.style.color = "white";
            }

            ctx.restore();
        }

        let cameraObj = null;

        function startCamera() {
            cameraObj = new Camera(video, {
                onFrame: async () => {
                    await pose.send({ image: video });
                },
                width: 480,
                height: 640
            });
            cameraObj.start();
        }

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('finishBtn').addEventListener('click', async () => {
            const userId = getUserId();
            const finishedCount = pushupCount;

            if (cameraObj) {
                cameraObj.stop();
            }

            if (userId && finishedCount > 0) {
                try {
                    await fetch(`${API_BASE}/api/save_pushups`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId, count: finishedCount })
                    });
                } catch (error) {
                    console.error("Не удалось сохранить подход:", error);
                }
            }

            pushupCount = 0;
            stage = "up";
            document.getElementById('counter').innerText = "0";
            cameraStarted = false;

            showScreen('menu');
        });
    </script>
</body>
</html>
