<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pushup Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            text-align: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
        .screen { display: none; padding: 20px 10px; }
        .screen.active { display: block; }

        .menu-button {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 12px auto;
            padding: 16px;
            font-size: 18px;
            background: #1c1c1c;
            color: white;
            border: 1px solid #333;
            border-radius: 12px;
        }
        .menu-button.primary {
            background: #00FF00;
            color: #111;
            font-weight: bold;
            border: none;
        }

        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: #00FF00;
            font-size: 18px;
        }

        .container { width: 480px; max-width: 100%; margin: 0 auto; }
        video { display: none; }
        canvas { display: block; width: 100%; height: auto; margin: 0 auto; }
        #status { font-size: 18px; margin: 8px; min-height: 24px; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            max-width: 320px;
            margin: 10px auto;
            padding: 12px 16px;
            background: #1c1c1c;
            border-radius: 10px;
        }

        .leader-row {
            display: flex;
            justify-content: space-between;
            max-width: 320px;
            margin: 6px auto;
            padding: 10px 16px;
            background: #1c1c1c;
            border-radius: 10px;
        }

        .achievement-row {
            max-width: 320px;
            margin: 8px auto;
            padding: 12px 16px;
            background: #1c1c1c;
            border-radius: 10px;
            text-align: left;
        }
        .achievement-row.locked { opacity: 0.4; }

        .loading { opacity: 0.6; font-size: 14px; margin: 10px; }
    </style>
</head>
<body>

    <!-- ===== ЭКРАН: ГЛАВНОЕ МЕНЮ ===== -->
    <div id="screen-menu" class="screen active">
        <h1>💪 Pushup Tracker</h1>
        <button class="menu-button primary" onclick="showScreen('camera')">📷 Начать поход</button>
        <button class="menu-button" onclick="showScreen('profile')">👤 Профиль</button>
        <button class="menu-button" onclick="showScreen('leaderboard')">🏆 Таблица лидеров</button>
        <button class="menu-button" onclick="showScreen('achievements')">🎖 Достижения</button>
    </div>

    <!-- ===== ЭКРАН: КАМЕРА / ПОДСЧЁТ ===== -->
    <div id="screen-camera" class="screen">
        <button class="back-button" onclick="showScreen('menu')">← Назад</button>
        <h2>Подсчёт отжиманий</h2>
        <h1 id="counter" style="font-size: 60px; color: #00FF00;">0</h1>
        <p id="status">Займите позицию для отжиманий 🧎</p>
        <button id="finishBtn" class="menu-button primary" style="max-width: 220px;">Завершить подход</button>
        <div class="container">
            <video id="video" width="480" height="640" autoplay playsinline muted></video>
            <canvas id="canvas" width="480" height="640"></canvas>
        </div>
    </div>

    <!-- ===== ЭКРАН: ПРОФИЛЬ ===== -->
    <div id="screen-profile" class="screen">
        <button class="back-button" onclick="showScreen('menu')">← Назад</button>
        <h2>👤 Профиль</h2>
        <div id="profile-loading" class="loading">Загрузка...</div>
        <div id="profile-content" style="display: none;">
            <div class="stat-row"><span>Звание</span><span id="profile-level">—</span></div>
            <div class="stat-row"><span>Очки</span><span id="profile-points">—</span></div>
            <div class="stat-row"><span>Отжиманий всего</span><span id="profile-total">—</span></div>
            <div class="stat-row"><span>До след. звания</span><span id="profile-next">—</span></div>
        </div>
    </div>

    <!-- ===== ЭКРАН: ТАБЛИЦА ЛИДЕРОВ ===== -->
    <div id="screen-leaderboard" class="screen">
        <button class="back-button" onclick="showScreen('menu')">← Назад</button>
        <h2>🏆 Таблица лидеров</h2>
        <div id="leaderboard-loading" class="loading">Загрузка...</div>
        <div id="leaderboard-list"></div>
    </div>

    <!-- ===== ЭКРАН: ДОСТИЖЕНИЯ ===== -->
    <div id="screen-achievements" class="screen">
        <button class="back-button" onclick="showScreen('menu')">← Назад</button>
        <h2>🎖 Достижения</h2>
        <div id="achievements-list"></div>
        <p style="opacity: 0.5; font-size: 14px;">(тестовые данные, подключим позже)</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        // ===== АДРЕС НАШЕГО СЕРВЕРА С БОТОМ И API =====
        const API_BASE = "https://pushup-bot-server.onrender.com";

        // ===== НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ =====

        let cameraStarted = false;

        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');

            if (name === 'camera' && !cameraStarted) {
                startCamera();
                cameraStarted = true;
            }
            if (name === 'profile') {
                loadProfile();
            }
            if (name === 'leaderboard') {
                loadLeaderboard();
            }
            if (name === 'achievements') {
                loadAchievementsMock();
            }
        }

        // ===== ПОЛУЧАЕМ ID ПОЛЬЗОВАТЕЛЯ ИЗ TELEGRAM =====

        function getUserId() {
            const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            return tgUser ? tgUser.id : null;
        }

        // ===== РЕАЛЬНЫЕ ДАННЫЕ С СЕРВЕРА =====

        async function loadProfile() {
            const userId = getUserId();
            document.getElementById('profile-loading').style.display = 'block';
            document.getElementById('profile-content').style.display = 'none';

            if (!userId) {
                document.getElementById('profile-loading').innerText = "Не удалось определить пользователя";
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/profile?user_id=${userId}`);
                const data = await response.json();

                document.getElementById('profile-level').innerText = data.level;
                document.getElementById('profile-points').innerText = data.points + " ⭐";
                document.getElementById('profile-total').innerText = data.total_pushups;
                document.getElementById('profile-next').innerText =
                    data.points_to_next_level !== null
                        ? `${data.points_to_next_level} очков до «${data.next_level}»`
                        : "Максимальный уровень! 🎉";

                document.getElementById('profile-loading').style.display = 'none';
                document.getElementById('profile-content').style.display = 'block';
            } catch (error) {
                document.getElementById('profile-loading').innerText = "Не удалось загрузить профиль. Попробуйте позже.";
            }
        }

        async function loadLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            const loading = document.getElementById('leaderboard-loading');
            loading.style.display = 'block';
            list.innerHTML = "";

            try {
                const response = await fetch(`${API_BASE}/api/leaderboard`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data.leaderboard.length === 0) {
                    list.innerHTML = "<p>Пока никто не отжимался 🤷</p>";
                    return;
                }

                data.leaderboard.forEach((user, index) => {
                    const row = document.createElement('div');
                    row.className = 'leader-row';
                    row.innerHTML = `<span>${index + 1}. ${user.name}</span><span>${user.points} ⭐</span>`;
                    list.appendChild(row);
                });
            } catch (error) {
                loading.innerText = "Не удалось загрузить таблицу лидеров. Попробуйте позже.";
            }
        }

        // ===== ДОСТИЖЕНИЯ (пока тестовые данные) =====

        function loadAchievementsMock() {
            const mockAchievements = [
                { title: "🥉 Первые 10 отжиманий", unlocked: true },
                { title: "🥈 100 отжиманий за день", unlocked: false },
                { title: "🥇 30 дней без пропуска", unlocked: false },
                { title: "🎯 1000 отжиманий за всё время", unlocked: false }
            ];
            const list = document.getElementById('achievements-list');
            list.innerHTML = "";
            mockAchievements.forEach(a => {
                const row = document.createElement('div');
                row.className = 'achievement-row' + (a.unlocked ? '' : ' locked');
                row.innerText = a.title + (a.unlocked ? " ✅" : " 🔒");
                list.appendChild(row);
            });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let stage = "up";
        let inPosition = false;

            }
            return angle;
        }

        const CONNECTIONS_TO_SHOW = [
            [LEFT_SHOULDER, LEFT_ELBOW],
