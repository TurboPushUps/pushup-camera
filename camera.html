<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подсчёт отжиманий</title>
    <style>
        body { margin: 0; text-align: center; background: #111; color: white; font-family: Arial, sans-serif; }
        .container { position: relative; width: 400px; margin: 0 auto; }
        video, canvas { position: absolute; top: 0; left: 0; width: 400px; height: 300px; }
    </style>
</head>
<body>
    <h2>Подсчёт отжиманий</h2>
    <div class="container">
        <video id="video" width="400" height="300" autoplay playsinline muted></video>
        <canvas id="canvas" width="400" height="300"></canvas>
    </div>

    <!-- Подключаем библиотеки MediaPipe через интернет (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Создаём объект Pose — это и есть нейросеть распознавания тела
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        // Настройки точности распознавания
        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // Эта функция вызывается КАЖДЫЙ РАЗ, когда нейросеть находит позу на новом кадре
        pose.onResults(onResults);

        function onResults(results) {
            // Очищаем канвас перед рисованием нового кадра
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем сам кадр с камеры на канвасе
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            // Если тело найдено — рисуем точки и соединения между ними
            if (results.poseLandmarks) {
                drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
                drawLandmarks(ctx, results.poseLandmarks, { color: '#FF0000', radius: 3 });
            }

            ctx.restore();
        }

        // Настраиваем камеру и подключаем её к нейросети
        const camera = new Camera(video, {
            onFrame: async () => {
                await pose.send({ image: video });
            },
            width: 400,
            height: 300
        });
        camera.start();
    </script>
</body>
</html>
