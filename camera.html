<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Камера для отжиманий</title>
</head>
<body>
    <h1>Проверка камеры</h1>
    <video id="video" width="400" height="300" autoplay playsinline></video>

    <script>
        // Находим элемент <video> на странице
        const video = document.getElementById('video');

        // Запрашиваем доступ к камере
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function (stream) {
                // Если доступ разрешён — подключаем видеопоток к элементу video
                video.srcObject = stream;
            })
            .catch(function (error) {
                // Если что-то пошло не так (например, отказали в доступе)
                console.error("Ошибка доступа к камере: ", error);
                alert("Не удалось получить доступ к камере: " + error.message);
            });
    </script>
</body>
</html>
