<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подсчёт отжиманий</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; text-align: center; background: #111; color: white; font-family: Arial, sans-serif; }
        .container { width: 480px; max-width: 100%; margin: 0 auto; }
        video { display: none; }
        canvas { display: block; width: 100%; height: auto; margin: 0 auto; }
        #status { font-size: 18px; margin: 8px; min-height: 24px; }
    </style>
</head>
<body>
    <h2>Подсчёт отжиманий</h2>
    <h1 id="counter" style="font-size: 60px; color: #00FF00;">0</h1>
    <p id="status">Займите позицию для отжиманий 🧎</p>

    <button id="finishBtn" style="font-size: 20px; padding: 10px 20px; margin: 10px; background: #00FF00; border: none; border-radius: 8px;">Завершить подход</button>

    <div class="container">
        <video id="video" width="480" height="640" autoplay playsinline muted></video>
        <canvas id="canvas" width="480" height="640"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let pushupCount = 0;
        let stage = "up";
        let inPosition = false;

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) {
                angle = 360 - angle;
            }
            return angle;
        }

        const LEFT_SHOULDER = 11;
        const RIGHT_SHOULDER = 12;
        const LEFT_ELBOW = 13;
        const RIGHT_ELBOW = 14;
        const LEFT_WRIST = 15;
        const RIGHT_WRIST = 16;

        const POINTS_TO_SHOW = [LEFT_SHOULDER, RIGHT_SHOULDER, LEFT_ELBOW, RIGHT_ELBOW, LEFT_WRIST, RIGHT_WRIST];

        const CONNECTIONS_TO_SHOW = [
            [LEFT_SHOULDER, LEFT_ELBOW],
            [LEFT_ELBOW, LEFT_WRIST],
            [RIGHT_SHOULDER, RIGHT_ELBOW],
            [RIGHT_ELBOW, RIGHT_WRIST],
            [LEFT_SHOULDER, RIGHT_SHOULDER]
        ];

        function checkPosition(landmarks) {
            const requiredPoints = [
                LEFT_SHOULDER, RIGHT_SHOULDER,
                LEFT_ELBOW, RIGHT_ELBOW,
                LEFT_WRIST, RIGHT_WRIST
            ];

            // Позиция засчитана, если ВСЕ шесть точек видны с достаточной уверенностью
            return requiredPoints.every(idx => landmarks[idx].visibility > 0.6);
        }

        function countPushups(landmarks) {
            const shoulder = landmarks[LEFT_SHOULDER];
            const elbow = landmarks[LEFT_ELBOW];
            const wrist = landmarks[LEFT_WRIST];

            const angle = calculateAngle(shoulder, elbow, wrist);

            if (angle < 90) {
                stage = "down";
            }

            if (angle > 160 && stage === "down") {
                stage = "up";
                pushupCount++;
                document.getElementById('counter').innerText = pushupCount;
            }
        }

        function drawSelectedLandmarks(landmarks) {
            ctx.strokeStyle = '#00FF00';
            ctx.lineWidth = 3;

            for (const [startIdx, endIdx] of CONNECTIONS_TO_SHOW) {
                const start = landmarks[startIdx];
                const end = landmarks[endIdx];
                ctx.beginPath();
                ctx.moveTo(start.x * canvas.width, start.y * canvas.height);
                ctx.lineTo(end.x * canvas.width, end.y * canvas.height);
                ctx.stroke();
            }

            ctx.fillStyle = '#FF0000';
            for (const idx of POINTS_TO_SHOW) {
                const point = landmarks[idx];
                ctx.beginPath();
                ctx.arc(point.x * canvas.width, point.y * canvas.height, 6, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        function onResults(results) {
            if (canvas.width !== results.image.width || canvas.height !== results.image.height) {
                canvas.width = results.image.width;
                canvas.height = results.image.height;
            }

            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.poseLandmarks) {
                drawSelectedLandmarks(results.poseLandmarks);

                inPosition = checkPosition(results.poseLandmarks);

                if (inPosition) {
                    statusEl.innerText = "Позиция ОК, считаем! 💪";
                    statusEl.style.color = "#00FF00";
                    countPushups(results.poseLandmarks);
                } else {
                    statusEl.innerText = "Займите позицию для отжиманий 🧎";
                    statusEl.style.color = "white";
                }
            } else {
                inPosition = false;
                statusEl.innerText = "Не вижу тело в кадре 👀";
                statusEl.style.color = "white";
            }

            ctx.restore();
        }

        const camera = new Camera(video, {
            onFrame: async () => {
                await pose.send({ image: video });
            },
            width: 480,
            height: 640
        });
        camera.start();

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('finishBtn').addEventListener('click', () => {
            tg.sendData(String(pushupCount));
            tg.close();
        });
    </script>
</body>
</html>
